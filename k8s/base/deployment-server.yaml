apiVersion: apps/v1
kind: Deployment
metadata:
  name: avatar-server
  namespace: gophprofile
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avatar-server
  template:
    metadata:
      labels:
        app: avatar-server
    spec:
      serviceAccountName: avatar-server-sa # сервис_акк

      securityContext: # Pod-level security of context
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: server
          image: gophprofile/server:latest
          imagePullPolicy: Never

          securityContext: # Container-level security of context
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 8085

          command: ["/server"]

          envFrom:
            - configMapRef:
                name: avatar-config
            - secretRef:
                name: avatar-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 30 # сколько ждать после старта
            periodSeconds: 10 # как часто проверять

          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5 # готов принимать трафик
            periodSeconds: 5