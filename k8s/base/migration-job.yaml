apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: gophprofile
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: migrate
          image: gophprofile/server:latest
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              echo "Running migrations..."
              go run github.com/pressly/goose/v3/cmd/goose@latest -dir /app/migrations postgres "$DB_DSN" up
              echo "Migrations completed..."
          envFrom:
            - secretRef:
                name: avatar-secrets
      restartPolicy: Never