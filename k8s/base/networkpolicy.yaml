apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: avatar-server-allow-ingress
  namespace: gophprofile
spec:
  podSelector:
    matchLabels:
      app: avatar-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ingress-nginx   # от Ingress
      ports:
        - protocol: TCP
          port: 8085

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-db-storage
  namespace: gophprofile
spec:
  podSelector:
    matchLabels:
      app: avatar-server
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 5672