basePath: /
definitions:
  github_com_heavydash_my-avatars-service_internal_domain.Avatar:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      error:
        type: string
      file_size:
        type: integer
      id:
        type: string
      original_url:
        type: string
      status:
        $ref: '#/definitions/github_com_heavydash_my-avatars-service_internal_domain.AvatarStatus'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  github_com_heavydash_my-avatars-service_internal_domain.AvatarStatus:
    enum:
    - uploading
    - ready
    - failed
    type: string
    x-enum-varnames:
    - AvatarStatusUploading
    - AvatarStatusReady
    - AvatarStatusFailed
host: localhost:8085
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API для управления аватарками пользователей
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GophProfile API
  version: "1.0"
paths:
  /api/v1/avatars:
    get:
      parameters:
      - description: ID пользователя
        in: query
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_heavydash_my-avatars-service_internal_domain.Avatar'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить все аватарки пользователя
      tags:
      - avatars
    post:
      consumes:
      - multipart/form-data
      description: Загружает файл аватарки (jpg, png, webp). Требуется авторизация.
      parameters:
      - description: Файл аватарки
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_heavydash_my-avatars-service_internal_domain.Avatar'
        "400":
          description: Неверный файл или формат
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Файл слишком большой
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Загрузить аватарку
      tags:
      - avatars
  /api/v1/avatars/{id}:
    delete:
      description: Удаляет аватарку. Можно удалять только свои аватарки.
      parameters:
      - description: ID аватарки
        in: path
        name: id
        required: true
        type: string
      - description: ID пользователя
        in: header
        name: X-User-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Аватарка удалена
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Нет прав на удаление
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Аватарка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Удалить аватарку
      tags:
      - avatars
    get:
      description: Возвращает редирект на оригинал или миниатюру аватарки
      parameters:
      - description: ID аватарки
        in: path
        name: id
        required: true
        type: string
      - description: Размер миниатюры (100x100, 300x300)
        in: query
        name: size
        type: string
      - description: Формат (jpg, webp)
        in: query
        name: format
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Редирект на файл
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Аватарка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить аватарку
      tags:
      - avatars
  /api/v1/avatars/{id}/metadata:
    get:
      parameters:
      - description: ID аватарки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить метаданные аватарки
      tags:
      - avatars
  /api/v1/users/{user_id}/avatar:
    get:
      parameters:
      - description: ID пользователя
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Редирект на аватарку
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить последнюю аватарку пользователя
      tags:
      - avatars
schemes:
- http
swagger: "2.0"
